<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جهانِ امین و نیایش | Loveniya</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    
    <!-- Firebase SDK (Compat Version for stability) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        /* Anti-Copy Measures */
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #ffe5ec 50%, #fcf6bd 100%);
            background-attachment: fixed;
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #4a403a;
            user-select: none; /* جلوگیری از انتخاب متن */
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overflow-x: hidden;
            margin: 0;
        }

        img, video { -webkit-user-drag: none; pointer-events: none; } /* جلوگیری از کشیدن عکس */
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .love-shadow { box-shadow: 0 15px 35px -10px rgba(255, 181, 167, 0.4); }
        html { scroll-behavior: smooth; }
        
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.4); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ffb5a7; border-radius: 10px; }

        /* Music Player Animation */
        .spin-slow { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-24 relative" oncontextmenu="return false;">

    <!-- ========================================== -->
    <!-- NAVIGATION -->
    <!-- ========================================== -->
    <nav id="main-nav" class="fixed top-0 w-full bg-white/60 backdrop-blur-md z-40 border-b border-rose-100 transition-all">
        <div class="max-w-4xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <div class="text-rose-400 font-bold tracking-wider text-base flex items-center gap-1.5">
                <i data-lucide="heart" class="w-4 h-4 fill-rose-300 text-rose-300"></i> Loveniya <span class="text-[10px] text-neutral-500 font-light">| امین و نیایش</span>
            </div>
            <ul class="hidden md:flex items-center gap-8 text-sm font-medium text-neutral-500">
                <li><a href="#section-timer" class="hover:text-rose-500 transition-colors">زمانِ ما</a></li>
                <li><a href="#section-memories" class="hover:text-rose-500 transition-colors">خاطرات</a></li>
                <li><a href="#section-pledges" class="hover:text-rose-500 transition-colors">عهدها</a></li>
            </ul>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- FLOATING MUSIC PLAYER -->
    <!-- ========================================== -->
    <div class="fixed bottom-6 right-6 z-50">
        <button onclick="toggleMusicModal()" class="bg-rose-400 text-white p-3.5 rounded-full shadow-xl hover:bg-rose-500 transition-transform hover:scale-110 flex items-center gap-2">
            <i data-lucide="music" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- Music Modal -->
    <div id="music-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm love-shadow relative">
            <button onclick="toggleMusicModal()" class="absolute top-4 left-4 text-neutral-400 hover:text-rose-500"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="text-lg font-bold text-neutral-800 mb-4 flex items-center gap-2"><i data-lucide="headphones" class="w-5 h-5 text-rose-400"></i> پلی‌لیست قلب ما</h3>
            
            <div class="mb-4 flex gap-2">
                <input type="text" id="music-url" placeholder="لینک آهنگ (MP3)..." class="flex-1 bg-neutral-50 border border-neutral-100 rounded-xl px-3 py-2 text-xs focus:border-rose-300 focus:outline-none">
                <input type="text" id="music-title" placeholder="اسم آهنگ..." class="w-1/3 bg-neutral-50 border border-neutral-100 rounded-xl px-2 py-2 text-xs focus:border-rose-300 focus:outline-none">
                <button onclick="addMusic()" class="bg-rose-400 text-white px-3 rounded-xl hover:bg-rose-500"><i data-lucide="plus" class="w-4 h-4"></i></button>
            </div>
            
            <div id="active-player-container" class="hidden mb-4 bg-rose-50 p-3 rounded-2xl border border-rose-100 text-center">
                <span id="playing-title" class="text-xs font-bold text-rose-600 block mb-2">در حال پخش...</span>
                <audio id="main-audio-player" controls class="w-full h-8 outline-none"></audio>
            </div>

            <ul id="music-list" class="space-y-2 max-h-48 overflow-y-auto custom-scroll pr-1"></ul>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MAIN CONTENT -->
    <!-- ========================================== -->
    <div id="page-home" class="max-w-4xl mx-auto px-6 pt-24 space-y-12">
        
        <!-- Hero Section -->
        <section class="text-center space-y-4 pt-4">
            <h1 class="text-3xl md:text-5xl font-black text-neutral-800 leading-tight">
                تقدیم به <span class="text-rose-500">نیایش</span>،<br> بهانه‌ی تمامِ عاشقانه‌هایم.
            </h1>
        </section>

        <!-- Timer Section -->
        <section id="section-timer" class="relative bg-white/60 backdrop-blur-sm rounded-3xl p-6 md:p-10 love-shadow border border-white/50 text-center">
            <h2 class="text-xs uppercase tracking-widest text-rose-400 font-bold mb-6 flex items-center justify-center gap-2">
                <i data-lucide="heart" class="w-3.5 h-3.5 fill-rose-400 text-rose-400"></i> تپش‌های قلبم از ۲۰ اردیبهشت ۱۴۰۵ <i data-lucide="heart" class="w-3.5 h-3.5 fill-rose-400 text-rose-400"></i>
            </h2>
            <div class="flex flex-wrap justify-center gap-3 md:gap-6 dir-rtl">
                <div class="text-center flex-1 min-w-[50px]"><span id="t-seconds" class="block text-3xl font-light text-rose-500 mb-1">00</span><span class="text-[10px] text-neutral-500">ثانیه</span></div>
                <div class="text-center flex-1 min-w-[50px]"><span id="t-minutes" class="block text-3xl font-light text-neutral-700 mb-1">00</span><span class="text-[10px] text-neutral-500">دقیقه</span></div>
                <div class="text-center flex-1 min-w-[50px]"><span id="t-hours" class="block text-3xl font-light text-neutral-700 mb-1">00</span><span class="text-[10px] text-neutral-500">ساعت</span></div>
                <div class="text-center flex-1 min-w-[50px]"><span id="t-days" class="block text-3xl font-light text-neutral-700 mb-1">0</span><span class="text-[10px] text-neutral-500">روز</span></div>
                <div class="text-center flex-1 min-w-[50px]"><span id="t-months" class="block text-3xl font-light text-neutral-800 mb-1">0</span><span class="text-[10px] text-neutral-500">ماه</span></div>
                <div class="text-center flex-1 min-w-[50px]"><span id="t-years" class="block text-3xl font-light text-neutral-800 mb-1">0</span><span class="text-[10px] text-neutral-500">سال</span></div>
            </div>
        </section>

        <!-- Memories List -->
        <section id="section-memories" class="bg-white/60 backdrop-blur-sm rounded-3xl p-6 md:p-8 love-shadow border border-white/50">
            <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
                <h2 class="text-xl font-bold text-neutral-800 flex items-center gap-2"><i data-lucide="camera" class="w-5 h-5 text-rose-400"></i> قابِ خاطرات</h2>
                <button onclick="toggleMemoryForm()" class="bg-rose-100 text-rose-600 hover:bg-rose-200 px-4 py-2 rounded-full text-xs font-bold transition-colors flex items-center gap-1.5">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> ثبت خاطره
                </button>
            </div>

            <!-- Memory Form -->
            <div id="memory-form-container" class="hidden mb-6 bg-white/80 rounded-2xl p-5 border border-rose-100">
                <form id="mem-form" onsubmit="saveMemory(event)" class="space-y-4">
                    <input type="hidden" id="edit-mem-id" value="">
                    <input type="text" id="mem-title" placeholder="عنوان خاطره..." required class="w-full bg-transparent border-b border-neutral-200 pb-2 text-sm focus:border-rose-400 focus:outline-none font-bold">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[11px] text-neutral-500 mb-1">آپلود عکس (کم‌حجم):</label>
                            <input type="file" id="mem-file-img" accept="image/*" class="text-xs file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:bg-rose-50 file:text-rose-600 cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-[11px] text-neutral-500 mb-1">یا لینک ویدیو (از سایت‌های دیگر):</label>
                            <input type="url" id="mem-vid-url" placeholder="https://..." class="w-full bg-transparent border-b border-neutral-200 pb-1 text-xs focus:border-rose-400 focus:outline-none">
                        </div>
                    </div>

                    <textarea id="mem-desc" rows="3" placeholder="شرح عاشقانه این لحظه..." required class="w-full bg-neutral-50 border border-neutral-100 rounded-xl p-3 text-xs focus:border-rose-400 focus:outline-none"></textarea>
                    
                    <div class="flex justify-end gap-2 pt-1">
                        <button type="button" onclick="toggleMemoryForm()" class="bg-neutral-200 text-neutral-700 text-xs px-4 py-2 rounded-full">انصراف</button>
                        <button type="submit" class="bg-rose-400 text-white text-xs font-bold px-6 py-2 rounded-full hover:bg-rose-500 shadow-md">ثبت در قلب سایت</button>
                    </div>
                </form>
            </div>

            <div id="memories-feed" class="space-y-3 max-h-[400px] overflow-y-auto custom-scroll pr-1"></div>
        </section>

        <!-- Pledges -->
        <section id="section-pledges" class="bg-white/60 backdrop-blur-sm rounded-3xl p-6 love-shadow border border-white/50">
            <h2 class="text-base font-bold text-neutral-800 mb-4 flex items-center gap-2"><i data-lucide="heart-handshake" class="w-4 h-4 text-rose-400"></i> عهدهای ما</h2>
            <div class="mb-4 flex gap-2">
                <input type="text" id="pledge-input" placeholder="قول جدید..." class="flex-1 bg-white/80 border border-neutral-100 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-rose-300">
                <button onclick="savePledge()" class="bg-neutral-800 text-white px-4 py-2 rounded-xl text-xs hover:bg-neutral-700">ثبت</button>
            </div>
            <ul id="pledges-list" class="space-y-2 max-h-48 overflow-y-auto custom-scroll pr-1"></ul>
        </section>
    </div>

    <!-- ========================================== -->
    <!-- SINGLE MEMORY PAGE -->
    <!-- ========================================== -->
    <div id="page-memory" class="hidden min-h-screen bg-[#fff0f3]">
        <nav class="sticky top-0 bg-white/70 backdrop-blur-md z-50 py-4 border-b border-rose-100">
            <div class="max-w-3xl mx-auto px-6">
                <button onclick="goBackHome()" class="flex items-center gap-2 text-sm text-neutral-600 hover:text-rose-600 font-bold">
                    <i data-lucide="arrow-right" class="w-4 h-4"></i> بازگشت
                </button>
            </div>
        </nav>

        <article class="max-w-2xl mx-auto px-6 py-12 pb-32 text-center">
            <div id="single-date" class="inline-block px-4 py-1.5 rounded-full bg-rose-100 text-rose-600 text-xs font-bold mb-4"></div>
            <h1 id="single-title" class="text-2xl md:text-4xl font-black text-neutral-800 mb-8 leading-tight"></h1>
            
            <div id="single-media" class="mb-8 flex flex-col items-center gap-4"></div>
            
            <p id="single-desc" class="text-neutral-700 font-medium leading-loose text-sm md:text-base whitespace-pre-line bg-white/60 p-6 rounded-3xl border border-white love-shadow text-justify dir-rtl"></p>
        </article>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT & FIREBASE LOGIC -->
    <!-- ========================================== -->
    <script>
        // Anti-Copy Logic (Keyboard Shortcuts)
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's' || e.key === 'p')) {
                e.preventDefault();
            }
        });

        lucide.createIcons();

        // 🛑🛑🛑 اطلاعات فایربیس خود را دقیقاً اینجا قرار دهید 🛑🛑🛑
        const firebaseConfig = {
            apiKey: "AIzaSyAGRjFE45VNGA5fiz6Ruqz_KLDdsgnTApc",
            authDomain: "amniya-love.firebaseapp.com",
            databaseURL: "
https://wispy-band-ebcc.am-b-asdfghjkl20112011.workers.dev/",
            projectId: "amniya-love",
            storageBucket: "amniya-love.firebasestorage.app",
            messagingSenderId: "512178131727",
            appId: "1:512178131727:web:e2089041537b7b2fbe247a",
            measurementId: "G-6NTJGRZJN6"
        };
        // 🛑🛑🛑 پایان بخش فایربیس 🛑🛑🛑

        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            console.log("Firebase Connected");
        } catch(e) {
            console.warn("خطا در اتصال دیتابیس. در حال استفاده از حافظه محلی (آفلاین).");
        }

        // --- Timer ---
        const startDate = new Date(2026, 4, 10, 0, 0, 0);
        setInterval(() => {
            const now = new Date();
            if(now < startDate) return;
            let diff = Math.floor((now - startDate)/1000);
            document.getElementById('t-seconds').innerText = (diff % 60).toString().padStart(2, '0'); diff = Math.floor(diff/60);
            document.getElementById('t-minutes').innerText = (diff % 60).toString().padStart(2, '0'); diff = Math.floor(diff/60);
            document.getElementById('t-hours').innerText = (diff % 24).toString().padStart(2, '0'); diff = Math.floor(diff/24);
            document.getElementById('t-days').innerText = diff % 30; diff = Math.floor(diff/30);
            document.getElementById('t-months').innerText = diff % 12; 
            document.getElementById('t-years').innerText = Math.floor(diff/12);
        }, 1000);

        // --- Data Fetching & Sync (Firebase + LocalStorage fallback) ---
        let memories = [];
        let pledges = [];
        let playlist = [];

        function loadData() {
            if(db) {
                db.ref('memories').on('value', snap => { memories = snap.val() ? Object.values(snap.val()).reverse() : []; renderMemories(); });
                db.ref('pledges').on('value', snap => { pledges = snap.val() ? Object.values(snap.val()) : []; renderPledges(); });
                db.ref('playlist').on('value', snap => { playlist = snap.val() ? Object.values(snap.val()) : []; renderPlaylist(); });
            } else {
                memories = JSON.parse(localStorage.getItem('loveniya_mems')||'[]');
                pledges = JSON.parse(localStorage.getItem('loveniya_plg')||'[]');
                playlist = JSON.parse(localStorage.getItem('loveniya_msc')||'[]');
                renderMemories(); renderPledges(); renderPlaylist();
            }
        }

        // --- Memory Logic ---
        function toggleMemoryForm() {
            document.getElementById('memory-form-container').classList.toggle('hidden');
            document.getElementById('mem-form').reset();
            document.getElementById('edit-mem-id').value = '';
        }

        async function saveMemory(e) {
            e.preventDefault();
            const id = document.getElementById('edit-mem-id').value || Date.now().toString();
            const title = document.getElementById('mem-title').value;
            const desc = document.getElementById('mem-desc').value;
            const vidUrl = document.getElementById('mem-vid-url').value;
            const imgFile = document.getElementById('mem-file-img').files[0];
            const btn = e.target.querySelector('button[type="submit"]');
            
            btn.innerText = 'در حال ثبت...';
            let imgData = null;

            if (imgFile) {
                imgData = await new Promise(res => {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const maxW = 600; const scale = maxW / img.width;
                            canvas.width = maxW; canvas.height = img.height * scale;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            res(canvas.toDataURL('image/jpeg', 0.6));
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(imgFile);
                });
            } else {
                const existing = memories.find(m => m.id === id);
                if(existing && existing.img) imgData = existing.img;
            }

            const newMem = { id, title, desc, img: imgData, video: vidUrl, date: new Date().toLocaleDateString('fa-IR') };

            if(db) {
                db.ref('memories/' + id).set(newMem);
            } else {
                memories = memories.filter(m => m.id !== id);
                memories.unshift(newMem);
                localStorage.setItem('loveniya_mems', JSON.stringify(memories));
                renderMemories();
            }

            toggleMemoryForm();
            btn.innerText = 'ثبت در قلب سایت';
        }

        function deleteMemory(id) {
            if(!confirm('مطمئنی می‌خوای این خاطره رو پاک کنی؟')) return;
            if(db) db.ref('memories/' + id).remove();
            else {
                memories = memories.filter(m => m.id !== id);
                localStorage.setItem('loveniya_mems', JSON.stringify(memories));
                renderMemories();
            }
        }

        function editMemory(id) {
            const mem = memories.find(m => m.id === id);
            if(!mem) return;
            document.getElementById('memory-form-container').classList.remove('hidden');
            document.getElementById('edit-mem-id').value = mem.id;
            document.getElementById('mem-title').value = mem.title;
            document.getElementById('mem-desc').value = mem.desc;
            document.getElementById('mem-vid-url').value = mem.video || '';
            window.scrollTo(0, document.getElementById('section-memories').offsetTop - 100);
        }

        function renderMemories() {
            const feed = document.getElementById('memories-feed');
            feed.innerHTML = '';
            memories.forEach(mem => {
                const item = document.createElement('div');
                item.className = "group bg-white/80 border border-neutral-100 hover:border-rose-300 rounded-2xl p-4 transition-all shadow-sm flex flex-col gap-3";
                
                const content = document.createElement('div');
                content.className = "flex items-center justify-between cursor-pointer";
                content.onclick = (e) => { if(!e.target.closest('button')) navigateToMemory(mem.id); };
                content.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center text-rose-500">
                            <i data-lucide="${mem.video ? 'video' : (mem.img ? 'image' : 'heart')}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="text-sm font-bold text-neutral-800">${mem.title}</h3>
                            <span class="text-[10px] text-neutral-500">${mem.date}</span>
                        </div>
                    </div>
                `;

                const actions = document.createElement('div');
                actions.className = "flex justify-end gap-2 pt-2 border-t border-rose-50";
                actions.innerHTML = `
                    <button onclick="editMemory('${mem.id}')" class="p-1.5 text-neutral-400 hover:text-blue-500 transition-colors"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
                    <button onclick="deleteMemory('${mem.id}')" class="p-1.5 text-neutral-400 hover:text-red-500 transition-colors"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                `;

                item.appendChild(content);
                item.appendChild(actions);
                feed.appendChild(item);
            });
            lucide.createIcons();
        }

        function navigateToMemory(id) {
            const mem = memories.find(m => m.id === id);
            if (!mem) return;

            document.getElementById('single-title').innerText = mem.title;
            document.getElementById('single-date').innerText = mem.date;
            document.getElementById('single-desc').innerText = mem.desc;
            
            const mediaCont = document.getElementById('single-media');
            mediaCont.innerHTML = '';
            
            if (mem.video) {
                mediaCont.innerHTML += `
                    <div class="w-full relative rounded-2xl overflow-hidden love-shadow border-4 border-white">
                        <video controls class="w-full max-h-[400px] object-cover" style="pointer-events: auto;">
                            <source src="${mem.video}" type="video/mp4">
                            مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
                        </video>
                    </div>
                    <a href="${mem.video}" target="_blank" class="bg-rose-100 text-rose-600 text-xs px-4 py-2 rounded-full font-bold inline-flex items-center gap-1 hover:bg-rose-200"><i data-lucide="download" class="w-3.5 h-3.5"></i> دانلود ویدیو (لینک مستقیم)</a>
                `;
            } else if (mem.img) {
                mediaCont.innerHTML += `
                    <img src="${mem.img}" class="max-h-[400px] w-auto rounded-2xl love-shadow border-4 border-white object-cover">
                    <a href="${mem.img}" download="loveniya-memory.jpg" class="bg-rose-100 text-rose-600 text-xs px-4 py-2 rounded-full font-bold inline-flex items-center gap-1 hover:bg-rose-200" style="pointer-events: auto;"><i data-lucide="download" class="w-3.5 h-3.5"></i> ذخیره عکس</a>
                `;
            }

            document.getElementById('page-home').style.display = 'none';
            document.getElementById('page-memory').style.display = 'block';
            window.scrollTo(0, 0);
            lucide.createIcons();
        }

        function goBackHome() {
            document.getElementById('page-memory').style.display = 'none';
            document.getElementById('page-home').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function savePledge() {
            const input = document.getElementById('pledge-input');
            const txt = input.value.trim();
            if(!txt) return;
            const id = Date.now().toString();
            const plg = { id, text: txt };
            if(db) db.ref('pledges/' + id).set(plg);
            else {
                pledges.push(plg);
                localStorage.setItem('loveniya_plg', JSON.stringify(pledges));
                renderPledges();
            }
            input.value = '';
        }

        function deletePledge(id) {
            if(db) db.ref('pledges/' + id).remove();
            else {
                pledges = pledges.filter(p => p.id !== id);
                localStorage.setItem('loveniya_plg', JSON.stringify(pledges));
                renderPledges();
            }
        }

        function renderPledges() {
            const list = document.getElementById('pledges-list');
            list.innerHTML = '';
            pledges.forEach(p => {
                const li = document.createElement('li');
                li.className = "flex items-start justify-between gap-2 border-b border-rose-50 pb-2";
                li.innerHTML = `
                    <div class="flex items-start gap-2">
                        <i data-lucide="check" class="w-3.5 h-3.5 text-rose-400 mt-1 shrink-0"></i>
                        <span class="text-xs text-neutral-600 leading-relaxed">${p.text}</span>
                    </div>
                    <button onclick="deletePledge('${p.id}')" class="text-neutral-300 hover:text-red-400 shrink-0"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                `;
                list.appendChild(li);
            });
            lucide.createIcons();
        }

        function toggleMusicModal() { document.getElementById('music-modal').classList.toggle('hidden'); }
        
        function addMusic() {
            const title = document.getElementById('music-title').value.trim();
            const url = document.getElementById('music-url').value.trim();
            if(!title || !url) return;
            const id = Date.now().toString();
            const msc = { id, title, url };
            if(db) db.ref('playlist/' + id).set(msc);
            else {
                playlist.push(msc);
                localStorage.setItem('loveniya_msc', JSON.stringify(playlist));
                renderPlaylist();
            }
            document.getElementById('music-title').value = '';
            document.getElementById('music-url').value = '';
        }

        function deleteMusic(id) {
            if(db) db.ref('playlist/' + id).remove();
            else {
                playlist = playlist.filter(m => m.id !== id);
                localStorage.setItem('loveniya_msc', JSON.stringify(playlist));
                renderPlaylist();
            }
        }

        function playMusic(url, title) {
            const container = document.getElementById('active-player-container');
            const player = document.getElementById('main-audio-player');
            const titleEl = document.getElementById('playing-title');
            container.classList.remove('hidden');
            titleEl.innerText = 'در حال پخش: ' + title;
            player.src = url;
            player.play();
        }

        function renderPlaylist() {
            const list = document.getElementById('music-list');
            list.innerHTML = '';
            playlist.forEach(m => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between p-2 hover:bg-rose-50 rounded-xl transition-colors border border-transparent hover:border-rose-100";
                li.innerHTML = `
                    <div class="flex items-center gap-2 cursor-pointer w-full" onclick="playMusic('${m.url}', '${m.title}')">
                        <div class="w-8 h-8 rounded-full bg-rose-200 text-white flex items-center justify-center shrink-0"><i data-lucide="play" class="w-4 h-4 ml-0.5"></i></div>
                        <span class="text-xs font-bold text-neutral-700 truncate w-40">${m.title}</span>
                    </div>
                    <button onclick="deleteMusic('${m.id}')" class="text-neutral-400 hover:text-red-500 p-1 shrink-0"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                `;
                list.appendChild(li);
            });
            lucide.createIcons();
        }

        loadData();
    </script>
</body>
</html>
