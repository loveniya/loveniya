name: Build and Deploy from ZIP

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract ZIP File
        run: |
          mkdir -p app
          unzip -o "*.zip" -d app/
          if [ ! -f "app/package.json" ]; then
            INNER_DIR=$(find app -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -f "$INNER_DIR/package.json" ]; then
              cp -r $INNER_DIR/* app/
            fi
          fi

      - name: Install Dependencies & Build
        run: |
          cd app
          npm install
          npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
